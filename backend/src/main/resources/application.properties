spring.application.name=coworking-space-saad-caufy

# PostgreSQL Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/coworking_space_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
app.jwtSecret=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}

# Server
server.port=${PORT:8080}
